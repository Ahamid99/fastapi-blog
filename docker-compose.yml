services:
  db:
    image: postgres:18
    container_name: fastapi_blog_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bloguser
      POSTGRES_PASSWORD: blogpass
      POSTGRES_DB: blog
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloguser -d blog"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

# docker compose stop        # stop, keep data
# docker compose start       # start again
# docker compose down        # stop and remove container, keep volume
# docker compose down -v     # stop and delete the data volume too
# docker compose logs -f db  # watch the logs
